[defaults]
inventory=./inventory
remote_user=redhat
collections_paths=/home/redhat/ansible/mycollection:/home/redhat/.ansible/collections:/usr/share/ansible/collections
roles_path=/home/redhat/ansible/roles:/home/redhat/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles

[privilege_escalation]
become=true
become_method=sudo
become_user=root
